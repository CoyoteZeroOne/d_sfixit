<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPAIR DESK // COMMUNITY NODE</title>
  <link rel="stylesheet" href="css/terminal.css">
</head>
<body>
  <div class="crt">
    <header class="site-header">
      <a class="brand" href="index.html">COMMUNITY<span>_</span>NODE</a>
      <nav aria-label="Main navigation">
        <a href="index.html">HOME</a>
        <a href="workshops.html">WORKSHOPS</a>
        <a class="active" href="repair.html">REPAIR</a>
      </nav>
    </header>

    <main>
      <section class="panel">
        <div class="prompt">> REPAIR.DESK</div>
        <h1>NEW REPAIR REQUEST</h1>
        <p class="muted">Tell us what is broken. This demo form does not transmit data yet.</p>

        <form id="repair-form" class="terminal-form">
          <label for="item">WHAT NEEDS FIXING?</label>
          <textarea id="item" name="item" rows="4" required placeholder="> describe the object, problem, symptoms..."></textarea>

          <label for="category">CATEGORY</label>
          <select id="category" name="category">
            <option>Electronics</option>
            <option>Small appliance</option>
            <option>Computer / device</option>
            <option>Mechanical</option>
            <option>Textile</option>
            <option>Other / not sure</option>
          </select>

          <label>HOW URGENT?</label>
          <div class="choices">
            <label><input type="radio" name="urgency" value="normal" checked> NORMAL</label>
            <label><input type="radio" name="urgency" value="soon"> SOON</label>
            <label><input type="radio" name="urgency" value="unsure"> I HAVE NO IDEA</label>
          </div>

          <div class="grid two">
            <div>
              <label for="name">YOUR NAME</label>
              <input id="name" name="name" required placeholder="> type here">
            </div>
            <div>
              <label for="email">EMAIL</label>
              <input id="email" type="email" name="email" required placeholder="> name@example.com">
            </div>
          </div>

          <label for="date">PREFERRED APPOINTMENT DATE</label>
          <input id="date" type="date" name="date" required>

          <button class="button" type="submit">[ SUBMIT REPAIR REQUEST ]</button>
        </form>

        <div id="repair-success" class="success" hidden></div>
      </section>
    </main>

    <footer class="statusbar">
      <span>STATUS: <b>ONLINE</b></span>
      <span>NODE: COMMUNITY-01</span>
      <span id="clock">--:--:--</span>
    </footer>
  </div>

  <script src="js/terminal.js"></script>
  <script>
    document.getElementById("repair-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const ticket = "R-" + Math.floor(10000 + Math.random() * 90000);
      const output = document.getElementById("repair-success");
      output.hidden = false;
      output.innerHTML = "<strong>REQUEST RECEIVED.</strong><br><br>TICKET: #" + ticket +
        "<br><br>This is a prototype. Connect the form to your booking/form service before launch.";
      event.currentTarget.reset();
    });
  </script>
</body>
</html>
