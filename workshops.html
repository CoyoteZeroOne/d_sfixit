<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WORKSHOPS // COMMUNITY NODE</title>
  <link rel="stylesheet" href="css/terminal.css">
</head>
<body>
  <div class="crt">
    <header class="site-header">
      <a class="brand" href="index.html">COMMUNITY<span>_</span>NODE</a>
      <nav aria-label="Main navigation">
        <a href="index.html">HOME</a>
        <a class="active" href="workshops.html">WORKSHOPS</a>
        <a href="repair.html">REPAIR</a>
      </nav>
    </header>

    <main>
      <section class="panel">
        <div class="prompt">> WORKSHOP.SCHEDULE</div>
        <h1>COMMUNITY WORKSHOPS</h1>
        <p class="muted">Select a date to inspect an event. Sample events are included so the interface works immediately.</p>
      </section>

      <section class="calendar-wrap panel">
        <div class="calendar-head">
          <button class="icon-button" id="prev-month" aria-label="Previous month">&lt;</button>
          <h2 id="month-label">MONTH</h2>
          <button class="icon-button" id="next-month" aria-label="Next month">&gt;</button>
        </div>
        <div id="calendar" class="calendar" aria-label="Workshop calendar"></div>
      </section>

      <section id="event-details" class="panel">
        <div class="panel-title">> EVENT.INFO</div>
        <div id="event-output" class="muted">SELECT A WORKSHOP DATE.</div>
      </section>
    </main>

    <footer class="statusbar">
      <span>STATUS: <b>ONLINE</b></span>
      <span>NODE: COMMUNITY-01</span>
      <span id="clock">--:--:--</span>
    </footer>
  </div>
  <script src="js/terminal.js"></script>
  <script src="js/workshops.js"></script>
  <script>initCalendar("calendar", "month-label", "event-output");</script>
</body>
</html>
