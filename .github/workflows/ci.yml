name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      # Cosmetic only — a formatting nit (e.g. an edit made through the GitHub
      # web UI, which skips the local pre-commit hook) shouldn't fail the
      # build. Still runs and still visible in the log, just non-blocking.
      - run: npm run format:check
        continue-on-error: true
      - run: npm run test
      - run: npm run build
